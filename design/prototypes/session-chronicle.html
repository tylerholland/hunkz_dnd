<!--
  Implementation note (Story 69 — Session Chronicle)
  - Chronicle page lists chapters → sessions. DM records a session by picking a time range of the
    live roll log (activity strip by LOCAL day, presets, exact times), unticking noise, naming it,
    choosing/creating a chapter. Saving snapshots the included events into the session record.
  - Session page: summary (anyone edits, "last edited by"), highlights computed from events,
    recollections (authors edit own, DM hides), collapsed activity log. DM: edit range, rename, delete.
  - Sessions can't overlap; recorded days are shaded in the strip.
  - Data here is the real roll log as of 2026-09-28 (read-only copy). The summary and recollection
    text on the first session are examples, marked as such.
-->

      <div class="page-head">
        <div><button type="button" class="link" id="back">← Chronicle</button><h1>${draft.editId ? "Edit session range" : "Record a session"}</h1>
        <p class="lede">Pick the stretch of the activity log this session covers. Nothing is removed from the live log. The session keeps its own copy.</p></div>
      </div>
      <div class="panel">
        <span class="step">1 · When was it?</span>
        <div class="strip-scroll" id="strip-scroll">
          <div class="strip" role="group" aria-label="Log activity by day">
            ${days.map((d) => {
              const k = dayKey(d), n = byDay.get(k) || 0, taken = !!takenBy(d + 12 * 3600000, draft.editId) && n > 0 && events.filter((e) => dayKey(e.ms) === k).every((e) => takenBy(e.ms, draft.editId));
              const inSel = d <= draft.end && endOfDay(d) >= draft.start;
              return `<button type="button" class="bar ${n ? "" : "empty"} ${inSel ? "in" : ""} ${taken ? "taken" : ""}" data-day="${d}" title="${fmtDay(d)} · ${n} event${n === 1 ? "" : "s"}${taken ? " · already in a session" : ""}" aria-label="${fmtDay(d)}, ${n} events${taken ? ", already recorded" : ""}"><i style="height:${n ? Math.max(4, (n / max) * 100) : 2}%"></i></button>`;
            }).join("")}
          </div>
          <div class="axis" aria-hidden="true">${days.map((d) => { const m = new Date(d).toLocaleDateString(undefined, { month: "short" }); const show = m !== lastMonth; lastMonth = m; return `<span>${show ? `<b>${m}</b>` : ""}</span>`; }).join("")}</div>
        </div>
        <div class="legend"><span><i style="background:var(--bar)"></i>Events that day</span><span><i style="background:var(--bar-sel)"></i>In this session</span><span><i style="background:repeating-linear-gradient(45deg,var(--taken) 0 3px,transparent 3px 6px);border:1px solid var(--taken)"></i>Already recorded</span></div>
        <p class="meta" style="margin:0">Click a day to pick it. Shift-click another day to stretch the range across both.</p>
        <div class="presets">
          <button type="button" class="chip" data-preset="today">Today</button>
          <button type="button" class="chip" data-preset="since">Since last session</button>
          <button type="button" class="chip" data-preset="week">Last 7 days</button>
        </div>
        <div class="times">
          <div class="field"><label for="start">Starts</label><input id="start" type="datetime-local" value="${toInput(draft.start)}"></div>
          <div class="field"><label for="end">Ends</label><input id="end" type="datetime-local" value="${toInput(draft.end)}"></div>
          <button type="button" class="chip" id="end-now">Ends now</button>
        </div>
      </div>

      <div class="panel" style="margin-top:14px">
        <span class="step">2 · What happened?</span>
        <div class="tally"><b>${included.length}</b> events${inRange.length !== included.length ? ` (${inRange.length - included.length} left out)` : ""} · <b>${who.length}</b> players${who.length ? ` · ${who.map(esc).join(", ")}` : ""}</div>
        ${conflict ? `<p class="warn" role="alert">Part of this range is already in “${esc(takenBy(conflict.ms, draft.editId).title)}”. Sessions can't overlap: narrow the range or untick those events.</p>` : ""}
        <div class="preview" id="preview">
          ${inRange.length ? [...groups.entries()].map(([k, evs]) => {
            const allOff = evs.every((e) => draft.excluded.has(e.id));
            return `<div class="day-group">
              <div class="day-head"><input type="checkbox" data-dayck="${k}" ${allOff ? "" : "checked"} aria-label="Include ${fmtDay(evs[0].ms)}"><span>${fmtDay(evs[0].ms, { weekday: "long" })}</span><span class="count">${evs.filter((e) => !draft.excluded.has(e.id)).length} of ${evs.length}</span></div>
              ${evs.map((e) => { const off = draft.excluded.has(e.id); const tk = takenBy(e.ms, draft.editId); return `<label class="ev ${off ? "off" : ""}"><input type="checkbox" data-ev="${e.id}" ${off ? "" : "checked"}><span class="t">${fmtTime(e.ms)}</span><span class="what">${evLine(e)}${tk ? ` <span class="warn">· in “${esc(tk.title)}”</span>` : ""}</span><span class="num">${evNum(e)}</span></label>`; }).join("")}
            </div>`;
          }).join("") : `<p class="empty-note" style="padding:14px">No log events in this range.</p>`}
        </div>
      </div>

      <div class="panel" style="margin-top:14px">
        <span class="step">3 · Name it</span>
        <div class="two">
          <div class="field"><label for="title">Session title</label><input id="title" value="${esc(draft.title)}"></div>
          <div class="field"><label for="chapter">Chapter</label>
            <select id="chapter">${S.chapters.map((c, i) => `<option value="${c.id}" ${draft.chapterId === c.id ? "selected" : ""}>Chapter ${i + 1}: ${esc(c.name)}</option>`).join("")}<option value="__new" ${draft.chapterId === "__new" ? "selected" : ""}>Start a new chapter…</option></select>
          </div>
        </div>
        ${draft.chapterId === "__new" ? `<div class="field"><label for="newch">New chapter name</label><input id="newch" value="${esc(draft.newChapter)}" placeholder="The Sunken Crossroads"></div>` : ""}
        <div class="row-actions">
          <span class="spacer"></span>
          <button type="button" class="btn quiet" id="cancel">Cancel</button>
          <button type="button" class="btn primary" id="save" ${!included.length || conflict ? "disabled" : ""}>${draft.editId ? "Save range" : "Record session"}</button>
        </div>
      </div>`;

    const rer = () => { const sc = document.getElementById("strip-scroll"); const x = sc.scrollLeft; const pv = document.getElementById("preview"); const y = pv?.scrollTop || 0; renderRecord(); document.getElementById("strip-scroll").scrollLeft = x; const pv2 = document.getElementById("preview"); if (pv2) pv2.scrollTop = y; };
    const setRange = (a, b) => { draft.start = Math.min(a, b); draft.end = Math.max(a, b); if (!draft.editId && !draft.titleTouched) draft.title = defaultTitle(); rer(); };
    app.querySelector("#back").onclick = () => go({ name: "list" });
    app.querySelector("#cancel").onclick = () => go(draft.editId ? { name: "session", id: draft.editId } : { name: "list" });
    app.querySelectorAll(".bar").forEach((b) => b.onclick = (ev) => {
      if (b.classList.contains("taken")) return;
      const d = +b.dataset.day;
      if (ev.shiftKey) setRange(Math.min(d, draft.start), Math.max(endOfDay(d), draft.end));
      else {
        const dayEvents = events.filter((e) => dayKey(e.ms) === dayKey(d) && !takenBy(e.ms, draft.editId));
        // Snap to the day's actual activity so the times read like a session, not midnight-to-midnight.
        if (dayEvents.length) setRange(dayEvents[0].ms, dayEvents[dayEvents.length - 1].ms);
        else setRange(startOfDay(d), endOfDay(d));
      }
    });
    app.querySelectorAll("[data-preset]").forEach((b) => b.onclick = () => {
      const now = Date.now();
      if (b.dataset.preset === "today") setRange(startOfDay(now), now);
      if (b.dataset.preset === "since") setRange(lastSessionEnd(draft.editId) + 1, now);
      if (b.dataset.preset === "week") setRange(startOfDay(now - 6 * 86400000), now);
    });
    app.querySelector("#start").onchange = (e) => { const ms = fromInput(e.target.value); if (ms != null) setRange(ms, draft.end); };
    app.querySelector("#end").onchange = (e) => { const ms = fromInput(e.target.value); if (ms != null) setRange(draft.start, ms); };
    app.querySelector("#end-now").onclick = () => setRange(draft.start, Date.now());
    app.querySelectorAll("[data-ev]").forEach((c) => c.onchange = () => { c.checked ? draft.excluded.delete(c.dataset.ev) : draft.excluded.add(c.dataset.ev); rer(); });
    app.querySelectorAll("[data-dayck]").forEach((c) => c.onchange = () => { inRange.filter((e) => dayKey(e.ms) === c.dataset.dayck).forEach((e) => c.checked ? draft.excluded.delete(e.id) : draft.excluded.add(e.id)); rer(); });
    app.querySelector("#title").oninput = (e) => { draft.title = e.target.value; draft.titleTouched = true; };
    app.querySelector("#chapter").onchange = (e) => { draft.chapterId = e.target.value; rer(); };
    app.querySelector("#newch")?.addEventListener("input", (e) => { draft.newChapter = e.target.value; });
    app.querySelector("#save").onclick = () => {
      let chapterId = draft.chapterId;
      if (chapterId === "__new") { chapterId = "c" + (S.chapters.length + 1) + Date.now(); S.chapters.push({ id: chapterId, name: draft.newChapter.trim() || `Chapter ${S.chapters.length + 1}` }); }
      // Trim the stored range to the first/last included event.
      const inc = included;
      const start = inc[0].ms, end = inc[inc.length - 1].ms;
      const excluded = new Set([...draft.excluded].filter((id) => { const e = events.find((x) => x.id === id); return e && e.ms >= start && e.ms <= end; }));
      if (draft.editId) {
        Object.assign(S.sessions.find((s) => s.id === draft.editId), { startMs: start, endMs: end, excluded, title: draft.title.trim() || defaultTitle(), chapterId });
        toast("Range saved"); go({ name: "session", id: draft.editId });
      } else {
        const s = { id: "s" + Date.now(), chapterId, title: draft.title.trim() || defaultTitle(), startMs: start, endMs: end, excluded, summary: null, recollections: [] };
        S.sessions.push(s); toast("Session recorded"); go({ name: "session", id: s.id });
      }
    };
    // keep the selection in view on first paint
    const sel = app.querySelector(".bar.in"); if (sel && !rer.done) { sel.scrollIntoView({ block: "nearest", inline: "center" }); }
  }

  // ── session page ────────────────────────────
  function highlights(evs) {
    const rolls = evs.filter((e) => !e.wheel && Number.isFinite(e.total));
    const d20 = rolls.filter((e) => /^1d20/.test(e.expr || ""));
    const nat20 = d20.filter((e) => e.crit || (e.dice && e.dice[0] === 20));
    const nat1 = d20.filter((e) => e.fumble || (e.dice && e.dice[0] === 1));
    const snake = rolls.filter((e) => /^2d6/.test(e.expr || "") && e.dice && e.dice.length === 2 && e.dice[0] === 1 && e.dice[1] === 1);
    const top = rolls.slice().sort((a, b) => b.total - a.total)[0];
    const counts = new Map(); rolls.forEach((e) => { const n = personFor(e).short; if (n !== "DM") counts.set(n, (counts.get(n) || 0) + 1); });
    const busiest = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
    const clocks = new Map(); evs.filter((e) => e.wheel).forEach((e) => clocks.set(e.wheel, e));
    const names = (list) => [...new Set(list.map((e) => personFor(e).short))].join(", ");
    return [
      { k: "Natural 20s", v: nat20.length, d: nat20.length ? names(nat20) : "None this time", cls: nat20.length ? "good" : "" },
      { k: "Natural 1s", v: nat1.length + snake.length, d: nat1.length + snake.length ? names([...nat1, ...snake]) : "Clean night", cls: nat1.length + snake.length ? "bad" : "" },
      top ? { k: "Highest roll", v: top.total, d: `${personFor(top).short} · ${top.label || "Roll"} (${top.expr})` } : null,
      busiest ? { k: "Most rolls", v: busiest[1], d: busiest[0] } : null,
      { k: "Clocks moved", v: clocks.size, d: clocks.size ? [...clocks.values()].map((e) => `${e.wheel}${e.filled != null ? ` ${e.filled}/${e.segments}` : ""}`).join(" · ") : "None" },
    ].filter(Boolean);
  }

  function renderSession(s) {
    if (!s) return go({ name: "list" });
    const evs = sessionEvents(s);
    const chapterIdx = S.chapters.findIndex((c) => c.id === s.chapterId);
    const chapter = S.chapters[chapterIdx];
    const who = players(evs);
    const me = S.role;
    const multi = dayKey(s.startMs) !== dayKey(s.endMs);
    const paras = (s.summary?.text || "").split(/\n{2,}/).filter(Boolean);
    app.innerHTML = `
      <div class="session-head">
        <button type="button" class="link" id="back" style="justify-self:start">← Chronicle</button>
        <span class="chapter-num">Chapter ${chapterIdx + 1} · ${esc(chapter?.name || "")}</span>
        <h1 id="title-h">${esc(s.title)}</h1>
        <span class="meta">${multi ? `${fmtDay(s.startMs, { weekday: "long" })} – ${fmtDay(s.endMs, { weekday: "long" })}` : `${fmtDay(s.startMs, { weekday: "long", year: "numeric" })} · ${fmtTime(s.startMs)} – ${fmtTime(s.endMs)}`}</span>
        <span class="who-row">${who.map((n) => `<span class="who"><span class="dot" style="background:${(Object.values(PEOPLE).find((p) => p.short === n) || {}).c}"></span>${esc(n)}</span>`).join("")}</span>
        ${isDm() ? `<div class="row-actions" style="margin-top:6px"><button type="button" class="btn quiet" id="rename">Rename</button><button type="button" class="btn quiet" id="range">Edit range</button><label class="field" style="grid-auto-flow:column;align-items:center;gap:8px"><span class="lbl">Chapter</span><select id="move">${S.chapters.map((c, i) => `<option value="${c.id}" ${c.id === s.chapterId ? "selected" : ""}>Chapter ${i + 1}</option>`).join("")}</select></label><span class="spacer"></span><button type="button" class="btn quiet danger" id="del">Delete session</button></div>` : ""}
      </div>
      <div class="grid">
        <div>
          <section class="section" aria-labelledby="sum-h">
            <div class="section-head"><h2 id="sum-h">Summary</h2>${s.summary?.example ? `<span class="summary"><span class="example">Example</span></span>` : ""}<span class="spacer"></span><button type="button" class="link" id="edit-sum">${s.summary?.text ? "Edit" : "Add summary"}</button></div>
            <div class="summary" id="sum-body">
              ${paras.length ? paras.map((p) => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("") : `<p class="empty-note">No summary yet. Paste one in: a transcript summary, the DM's notes, anyone's account of the night.</p>`}
              ${s.summary?.at ? `<span class="edited">Last edited by ${esc(nameOf(s.summary.by))} · ${ago(s.summary.at)}</span>` : ""}
            </div>
          </section>
          <section class="section" aria-labelledby="rec-h">
            <div class="section-head"><h2 id="rec-h">Recollections</h2><span class="meta">${me === "dm" ? "Players' own notes. You can hide any." : "Your notes on the night, in your own words."}</span></div>
            <div class="recs">
              ${s.recollections.filter((r) => !r.hidden || isDm() || r.by === me).map((r) => `
                <div class="rec ${r.hidden ? "hidden" : ""}" style="--c:${colorOf(r.by)}" data-rec="${r.id}">
                  <p>${esc(r.text)}</p>
                  <span class="by"><b>${esc(nameOf(r.by))}</b><span>${ago(r.at)}${r.hidden ? " · hidden by the DM" : ""}</span>
                    ${r.by === me ? `<button type="button" class="link" data-editrec="${r.id}">Edit</button>` : ""}
                    ${isDm() ? `<button type="button" class="link" data-hide="${r.id}">${r.hidden ? "Show" : "Hide"}</button>` : ""}
                  </span>
                </div>`).join("") || `<p class="empty-note">No recollections yet.</p>`}
              ${me !== "dm" ? `<form class="rec-form field" id="rec-form"><label for="rec-text">Add a recollection as ${esc(nameOf(me))}</label><textarea id="rec-text" placeholder="What do you remember about this session?"></textarea><div class="row-actions"><span class="spacer"></span><button type="submit" class="btn primary">Add</button></div></form>` : ""}
            </div>
          </section>
        </div>
        <div>
          <section class="section" aria-labelledby="hl-h">
            <div class="section-head"><h2 id="hl-h">Highlights</h2><span class="meta">From the log</span></div>
            <div class="hl">${highlights(evs).map((h) => `<div class="hl-card ${h.cls || ""}"><span class="k">${h.k}</span><span class="v">${h.v}</span><span class="d">${esc(h.d)}</span></div>`).join("")}</div>
          </section>
          <details class="log">
            <summary>Activity log · ${evs.length} events</summary>
            <div class="preview">${evs.slice().reverse().map((e) => `<div class="ev" style="grid-template-columns:64px minmax(0,1fr) auto"><span class="t">${fmtTime(e.ms)}</span><span class="what">${evLine(e)}</span><span class="num">${evNum(e)}</span></div>`).join("")}</div>
          </details>
        </div>
      </div>`;

    app.querySelector("#back").onclick = () => go({ name: "list" });
    app.querySelector("#edit-sum").onclick = () => {
      const body = app.querySelector("#sum-body");
      body.innerHTML = `<div class="field"><label for="sum-text">Summary · everyone can edit</label><textarea id="sum-text">${esc(s.summary?.text || "")}</textarea></div><div class="row-actions" style="margin-top:8px"><span class="meta">Paste a transcript summary or write your own. Blank lines start new paragraphs.</span><span class="spacer"></span><button type="button" class="btn quiet" id="sum-cancel">Cancel</button><button type="button" class="btn primary" id="sum-save">Save</button></div>`;
      const ta = body.querySelector("textarea"); ta.focus();
      body.querySelector("#sum-cancel").onclick = () => renderSession(s);
      body.querySelector("#sum-save").onclick = () => { s.summary = { text: ta.value.trim(), by: me, at: Date.now() }; toast("Summary saved"); renderSession(s); };
    };
    app.querySelector("#rec-form")?.addEventListener("submit", (e) => { e.preventDefault(); const t = app.querySelector("#rec-text").value.trim(); if (!t) return; s.recollections.push({ id: "r" + Date.now(), by: me, text: t, at: Date.now(), hidden: false }); renderSession(s); });
    app.querySelectorAll("[data-hide]").forEach((b) => b.onclick = () => { const r = s.recollections.find((x) => x.id === b.dataset.hide); r.hidden = !r.hidden; renderSession(s); });
    app.querySelectorAll("[data-editrec]").forEach((b) => b.onclick = () => {
      const r = s.recollections.find((x) => x.id === b.dataset.editrec), box = app.querySelector(`[data-rec="${r.id}"]`);
      box.innerHTML = `<div class="field"><label for="er-${r.id}">Edit your recollection</label><textarea id="er-${r.id}">${esc(r.text)}</textarea></div><div class="row-actions" style="margin-top:6px"><span class="spacer"></span><button type="button" class="btn quiet" data-c>Cancel</button><button type="button" class="btn primary" data-s>Save</button></div>`;
      box.querySelector("[data-c]").onclick = () => renderSession(s);
      box.querySelector("[data-s]").onclick = () => { r.text = box.querySelector("textarea").value.trim() || r.text; r.at = Date.now(); renderSession(s); };
    });
    app.querySelector("#rename")?.addEventListener("click", () => {
      const h = app.querySelector("#title-h"); h.innerHTML = `<input aria-label="Session title" value="${esc(s.title)}">`;
      const inp = h.querySelector("input"); inp.focus(); inp.select();
      const done = (save) => { if (save && inp.value.trim()) s.title = inp.value.trim(); renderSession(s); };
      inp.onkeydown = (e) => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); };
      inp.onblur = () => done(true);
    });
    app.querySelector("#range")?.addEventListener("click", () => startRecord(s.id));
    app.querySelector("#move")?.addEventListener("change", (e) => { s.chapterId = e.target.value; toast("Moved"); renderSession(s); });
    app.querySelector("#del")?.addEventListener("click", (e) => {
      const b = e.currentTarget;
      if (b.dataset.armed) { S.sessions = S.sessions.filter((x) => x.id !== s.id); toast("Session deleted. The live log is untouched."); go({ name: "list" }); return; }
      b.dataset.armed = "1"; b.textContent = "Tap again to delete"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Delete session"; } }, 3000);
    });
  }

  render();
})();
</script>
