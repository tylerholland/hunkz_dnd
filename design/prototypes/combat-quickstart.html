<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Combat Quick Start</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IM+Fell+English&display=swap" rel="stylesheet" />
<!--
  Combat Quick Start — prototype, no live API.

  Why a step-through card and not a spotlight tour (like the shop's):
  most combat controls only exist mid-action — the attack bar appears only
  once you've targeted someone, "Deal Damage" only on a player's targeted
  damage roll, the Deal Damage pop-up only after choosing an action. A tour
  pointing at live controls would find them missing. So each step shows a
  small drawing of the real control, in the app's own look, beside 2–3
  plain sentences.

  Two guides, same component:
  - Players (7 steps): open the map → hold an enemy to target → pick a weapon
    or spell → roll to hit (N/ADV/DIS, tap the dice to change them) → roll
    damage (riders, change dice, ↺ Again; the DM applies it) → other moves:
    a Free Roll labelled in its "For" box as you roll (the Chronicle's ✎ is
    the fallback) → End Turn.
  - DM (7 steps): Combat on → long-press a token to act → pick the target →
    pick the action (to-hit is rolled in the Dice Roller) → the Deal Damage
    pop-up (Roll, Crit, ½, ×2, ±, Miss, Apply) → a player's damage roll in
    History ("Deal Damage", "Apply Effect") → labelling events as they
    happen (✎) and Next Turn.
  Where it opens:
  - ⋯ menu → "Combat quick start", on a player's Session sheet and on the
    DM's Campaign page (always available).
  - Offered once per device the first time someone sees combat: players get
    a one-line note above the map ("New to combat here? Quick start ›"); the
    DM gets it the first time they switch to Combat. Dismissed for good once
    opened or closed (localStorage).
  Behaviour: Back / Next / Done, ← → and Esc, step dots you can tap, "Step n
  of N". A centred card on desktop, a sheet from the bottom on phones.
  Nothing in the game changes while it's open.
  Copy comes from the code as it is (see notes in the hand-off), e.g. hold
  500ms to target, crit only on a natural 20 of a single d20.
-->
<style>
  :root {
    --bg:#0d0f14; --solid:#111e2c; --surface:rgba(18,32,48,.55); --border:rgba(100,130,160,.24); --accent:#6a8fa8; --bright:#a0c0d0;
    --dim:#1e3a4e; --text:#c8bfaf; --body:#b0a898; --muted:#8193a0; --page:#080a0e; --gold:#e6bd62; --red:#c06060; --green:#6fbf86;
    --shade:rgba(3,5,8,.7); --mock:#0b1520;
  }
  body[data-pal="vellum"] {
    --bg:#f5f0e8; --solid:#ece4d2; --surface:rgba(220,208,185,.5); --border:rgba(140,110,70,.3); --accent:#7a5c30; --bright:#4a3418;
    --dim:rgba(140,110,70,.16); --text:#2a2018; --body:#3c2e1c; --muted:#7d6448; --page:#e9e1d2; --gold:#8a6418; --red:#9a2a20; --green:#2f7a45;
    --shade:rgba(60,45,25,.45); --mock:#e3d8c2;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--body); font-family:'Crimson Text',Georgia,serif; font-size:16px; line-height:1.5; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--bright); outline-offset:2px; }
  main { max-width:1180px; margin:0 auto; padding:24px 16px 80px; display:grid; gap:24px; }
  h1 { margin:0; font-family:'Cinzel',serif; font-weight:400; letter-spacing:.08em; color:var(--text); font-size:22px; }
  .note { margin:6px 0 0; font-style:italic; color:var(--muted); font-size:15px; max-width:820px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .ctl { display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
  .ctl button { border:0; background:transparent; padding:7px 13px; color:var(--muted); font-family:'IM Fell English',serif; font-size:13px; }
  .ctl button.on { background:var(--dim); color:var(--text); }
  .where { margin:0 0 8px; font-family:'IM Fell English',serif; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .frames { display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:22px; align-items:start; }
  @media (max-width:980px){ .frames{ grid-template-columns:1fr; } }
  .frame { position:relative; border:1px solid var(--border); border-radius:12px; background:var(--bg); min-height:640px; overflow:hidden; }
  .phone { width:390px; max-width:100%; min-height:780px; }
  /* A sketch of the page behind */
  .behind { padding:14px; opacity:.55; }
  .behind .bar { height:40px; border-bottom:1px solid var(--border); margin:-14px -14px 12px; display:flex; align-items:center; padding:0 12px; gap:8px; font-family:'Cinzel',serif; font-size:13px; color:var(--text); }
  .behind .blk { height:80px; border:1px solid var(--border); border-radius:8px; background:var(--surface); margin-bottom:10px; }
  .offer { display:flex; align-items:center; gap:8px; margin:0 0 10px; padding:8px 12px; border:1px dashed var(--accent); border-radius:8px; color:var(--text); font-size:14px; opacity:1; }
  .offer button { border:0; background:transparent; color:var(--bright); font-family:'Cinzel',serif; font-size:12px; letter-spacing:.08em; }

  /* The guide */
  .shade { position:absolute; inset:0; background:var(--shade); display:flex; align-items:center; justify-content:center; z-index:5; }
  .phone .shade { align-items:flex-end; }
  .guide { width:min(560px, calc(100% - 28px)); max-height:calc(100% - 28px); overflow:auto; border:1px solid var(--accent); border-radius:14px; background:var(--solid); box-shadow:0 18px 60px rgba(0,0,0,.5); }
  .phone .guide { width:100%; border-radius:16px 16px 0 0; border-bottom:0; max-height:94%; }
  .g-head { display:flex; align-items:center; gap:10px; padding:14px 16px 0; }
  .g-kicker { font-family:'IM Fell English',serif; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  .g-x { margin-left:auto; width:40px; height:40px; border:0; border-radius:50%; background:transparent; color:var(--muted); font-size:15px; }
  .g-art { margin:10px 16px 0; padding:16px; border:1px solid var(--border); border-radius:10px; background:var(--mock); min-height:170px; display:flex; align-items:center; justify-content:center; }
  .g-body { padding:12px 18px 6px; }
  .g-body h3 { margin:0 0 4px; font-family:'Cinzel',serif; font-weight:400; font-size:20px; letter-spacing:.04em; color:var(--text); }
  .g-body p { margin:0 0 8px; font-size:16px; }
  .g-body .tip { font-size:14px; font-style:italic; color:var(--muted); }
  .g-foot { display:flex; align-items:center; gap:8px; padding:10px 16px 16px; }
  .dots { display:flex; gap:6px; margin-right:auto; }
  .dots button { width:10px; height:10px; padding:0; border-radius:50%; border:0; background:var(--border); }
  .dots button.on { background:var(--gold); }
  .btn { min-height:38px; padding:0 14px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--bright); font-family:'Cinzel',serif; font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  .btn.primary { border-color:var(--accent); background:var(--dim); }
  .btn:disabled { opacity:.4; cursor:default; }

  /* Mini mocks of the real controls */
  .m-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }
  .m-col { display:grid; gap:10px; justify-items:center; width:100%; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border:1px solid var(--border); border-radius:6px; background:var(--solid); font-family:'Cinzel',serif; font-size:12px; letter-spacing:.06em; color:var(--text); }
  .chip.sel { border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold); }
  .chip small { color:var(--accent); font-family:'Crimson Text',serif; font-size:13px; }
  .chip.pri { border-color:var(--accent); background:var(--dim); color:var(--bright); }
  .chip.ghost { background:transparent; color:var(--muted); }
  .expr { border-bottom:1px dashed var(--accent); color:var(--bright); padding:0 2px; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
  .seg span { padding:5px 12px; font-family:'IM Fell English',serif; font-size:13px; color:var(--muted); }
  .seg span.on { background:var(--dim); color:var(--text); }
  .seg span.red { color:var(--red); }
  .token { position:relative; width:64px; height:64px; border-radius:50%; border:2px solid var(--red); background:radial-gradient(circle at 40% 35%, #6b4b3a, #2a1a14); display:flex; align-items:center; justify-content:center; color:#f3e6d0; font-family:'Cinzel',serif; font-size:13px; }
  .token.pc { border-color:var(--accent); background:radial-gradient(circle at 40% 35%, #3d5a70, #14202b); }
  .ring { position:absolute; inset:-9px; border-radius:50%; border:3px solid transparent; border-top-color:var(--gold); border-right-color:var(--gold); animation:charge 1.4s linear infinite; }
  .reticle { position:absolute; inset:-12px; border-radius:50%; border:2px dashed var(--gold); }
  @keyframes charge { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation:none; } }
  .lbl { font-size:13px; color:var(--muted); font-style:italic; text-align:center; }
  .atkbar { width:100%; max-width:440px; border:1px solid var(--accent); border-radius:10px; background:var(--solid); padding:10px; display:grid; gap:8px; }
  .atkbar .top { display:flex; align-items:center; gap:8px; font-family:'Cinzel',serif; font-size:13px; color:var(--text); }
  .atkbar .top .x { margin-left:auto; color:var(--muted); }
  .result { display:flex; align-items:baseline; gap:10px; font-family:'Cinzel',serif; }
  .result b { font-size:30px; font-weight:400; color:var(--bright); }
  .badge { padding:1px 8px; border-radius:999px; border:1px solid var(--gold); color:var(--gold); font-size:11px; letter-spacing:.12em; }
  .modal { width:100%; max-width:420px; border:1px solid var(--accent); border-radius:10px; background:var(--solid); padding:12px; display:grid; gap:8px; font-size:14px; }
  .modal .t { font-family:'Cinzel',serif; color:var(--text); font-size:14px; }
  .hpbar { height:8px; border-radius:4px; background:var(--dim); overflow:hidden; } .hpbar i { display:block; height:100%; width:55%; background:var(--red); }
  .num { width:56px; text-align:center; padding:4px; border:1px solid var(--border); border-radius:5px; background:var(--bg); color:var(--text); }
  .log { width:100%; max-width:440px; display:grid; gap:6px; font-size:14px; }
  .log div { display:flex; align-items:center; gap:8px; padding:6px 8px; border-bottom:1px dashed var(--border); }
  .log b { color:var(--text); font-weight:600; }
  .log .pen { margin-left:auto; color:var(--muted); }
  .log .tag { color:var(--accent); font-style:italic; }
  .endturn { padding:8px 16px; border:1px solid var(--gold); border-radius:8px; color:var(--gold); font-family:'Cinzel',serif; font-size:13px; letter-spacing:.06em; }
  .hl { outline:2px solid var(--gold); outline-offset:3px; border-radius:6px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Combat quick start</h1>
    <p class="note">A short illustrated guide to combat, one for players and one for the DM. Opened from ⋯ → “Combat quick start”, and offered once the first time someone sees combat. Each step draws the real control, since most combat controls only appear mid-action.</p>
    <div class="controls" style="margin-top:12px">
      <span class="ctl"><button data-who="player" class="on">Player guide</button><button data-who="dm">DM guide</button></span>
      <span class="ctl"><button data-pal="ocean" class="on">Ocean</button><button data-pal="vellum">Vellum</button></span>
      <span class="ctl"><button data-reopen>Open the guide</button></span>
    </div>
  </header>
  <section>
    <p class="where">Desktop and phone</p>
    <div class="frames">
      <div class="frame" id="wide"></div>
      <div class="frame phone" id="narrow"></div>
    </div>
  </section>
</main>

<script>
  const STEPS = {
    player: [
      {
        t: "Open the map",
        p: ["When the DM starts combat, your sheet's map shows a <b>Combat</b> mark. Open the map: that's where you choose who you're attacking."],
        tip: "Drag the map's lower edge to make it taller.",
        art: `<div class="m-col"><div class="chip" style="width:100%;max-width:400px;justify-content:space-between">MAP · The Sewers <span class="chip pri" style="padding:2px 8px">Combat</span></div><div class="lbl">Tap the map's heading to open it</div></div>`,
      },
      {
        t: "Hold an enemy to target it",
        p: ["<b>Press and hold</b> an enemy's token until the ring fills (half a second). A target mark appears and your attack bar opens at the bottom.", "A quick tap shows the enemy's card instead. Hold the same enemy again to clear the target, or hold another to switch."],
        art: `<div class="m-row" style="gap:46px"><div class="m-col"><div class="token">Rat<span class="ring"></span></div><div class="lbl">hold…</div></div><div class="m-col"><div class="token">Rat<span class="reticle"></span></div><div class="lbl">targeted</div></div></div>`,
      },
      {
        t: "Choose your attack",
        p: ["The bar shows your target and your weapons, Unarmed Strike and attack spells, each with its to-hit. Tap one."],
        tip: "Spells marked ✶ use a slot; with none left they can't be chosen. × closes the bar.",
        art: `<div class="atkbar"><div class="top">◎ Giant Rat<span class="x">×</span></div><div class="m-row" style="justify-content:flex-start"><span class="chip sel">Dagger <small>+5</small></span><span class="chip">Unarmed <small>+3</small></span><span class="chip">✶ Eldritch Blast <small>+6</small></span></div></div>`,
      },
      {
        t: "Roll to hit",
        p: ["Pick <b>N</b>, <b>ADV</b> or <b>DIS</b>, then tap <b>Attack</b> (or <b>✶ Cast</b> for a spell).", "Need different dice, like a bless bonus? <b>Tap the dice</b> (<span class='expr'>1d20+5</span>) and type your own before you roll."],
        tip: "A natural 20 shows CRIT; a natural 1 shows FUMBLE. ↺ Again rerolls.",
        art: `<div class="atkbar"><div class="top">◎ Giant Rat<span class="x">×</span></div><div class="m-row" style="justify-content:flex-start"><span class="chip sel">Dagger · <span class="expr">1d20+5</span></span><span class="seg"><span>N</span><span class="on">ADV</span><span>DIS</span></span><span class="chip pri hl">Attack</span></div></div>`,
      },
      {
        t: "Roll damage",
        p: ["If it hits, tap <b>Damage</b>: it's in the same spot as Attack. Tap the dice first to change them (an extra 1d6, say).", "Effects you've put on the target, like <b>✦ +1d6 Hex</b>, add on automatically; tap one to leave it out. The DM decides whether it hit and applies the damage."],
        art: `<div class="atkbar"><div class="top">◎ Giant Rat<span class="x">×</span></div><div class="result"><b>19</b><span class="badge">CRIT</span></div><div class="m-row" style="justify-content:flex-start"><span class="chip ghost">↺ Again</span><span class="chip pri hl">⚔ Damage</span><span class="chip">✦ +1d6 Hex</span></div></div>`,
      },
      {
        t: "Other moves: free rolls",
        p: ["Shoving, climbing, grappling, sneaking past? Open the <b>Dice</b> panel and use <b>Free Roll</b>: pick the dice, add a modifier, and type what it's for in the <b>For</b> box, like “Shove the goblin”. Then roll.", "<b>Label it as you roll</b>, while it's fresh: the log then tells the story of the fight, and nobody has to remember later what a lone 14 was for."],
        tip: "Forgot? You can still label it afterwards in the Chronicle with ✎.",
        art: `<div class="m-col"><div class="modal" style="max-width:400px"><div class="t">Free Roll</div><div class="m-row" style="justify-content:flex-start"><span class="chip sel">d20</span><span class="chip">+ Modifier <small>+3</small></span></div><div class="m-row" style="justify-content:flex-start;width:100%"><span style="color:var(--muted)">For</span><span class="num hl" style="flex:1;width:auto;text-align:left;padding:6px 10px">Shove the goblin</span></div><div class="m-row" style="justify-content:flex-end"><span class="chip pri">Roll 1d20+3</span></div></div><div class="log"><div><b>Eòghan</b> Free Roll · 17 <span class="tag">· Shove the goblin</span></div></div></div>`,
      },
      {
        t: "End your turn",
        p: ["When you're done, tap <b>End Turn</b> so the next person goes (if your DM allows it). Your turn shows in the Initiative list, with a banner when it comes round."],
        art: `<div class="m-col"><span class="endturn">End Turn · when you're done</span><div class="lbl">“Your turn · Round 2” appears when it's you</div></div>`,
      },
    ],
    dm: [
      {
        t: "Start combat",
        p: ["Switch the Campaign page to <b>Combat</b> (the tab hanging under the top bar). Everyone's map switches to battle, and players can attack."],
        art: `<div class="m-col"><span class="seg"><span>Adventure</span><span class="on red">Combat</span></span><div class="lbl">Adventure ends combat again</div></div>`,
      },
      {
        t: "Long-press a token to act with it",
        p: ["On the map, <b>press and hold any token</b>, a character or an NPC, until “Hold to act” fills. That's who's acting.", "Tap and drag still moves tokens."],
        art: `<div class="m-row" style="gap:40px"><div class="m-col"><div class="token">Ogre<span class="ring"></span></div><div class="lbl">Hold to act</div></div></div>`,
      },
      {
        t: "Pick the target",
        p: ["Now <b>tap or long-press the token they're acting on</b>, or choose <b>Target self</b>. The drawer shows who's acting on whom."],
        art: `<div class="m-col"><div class="m-row" style="gap:40px"><div class="token">Ogre</div><span style="font-size:22px;color:var(--muted)">→</span><div class="token pc">Eòg<span class="reticle"></span></div></div><div class="m-row"><span class="chip ghost">Target self</span><span class="chip ghost">Cancel</span></div></div>`,
      },
      {
        t: "Pick the action",
        p: ["Choose a weapon, spell or <b>Heal</b>. NPCs get quick attacks (Swing Sword 1d8, Throw Rock 1d4…) and a <b>✶ Magic</b> list; each remembers the last dice you used.", "Roll the NPC's <b>to-hit</b> in the Dice Roller (d20 with Adv. or Disadv.); the action handles damage."],
        art: `<div class="m-col"><div class="t" style="font-family:'Cinzel',serif;color:var(--text)">Ogre → Eòghan</div><div class="m-row"><span class="chip">Swing Sword <small>1d8</small></span><span class="chip">Throw Rock <small>1d4</small></span><span class="chip">✚ Heal</span><span class="chip">✶ Magic ▾</span></div></div>`,
      },
      {
        t: "Deal the damage",
        p: ["Tap <b>Roll</b> (change the dice first if you like). Turn on <b>Crit</b> before rolling to double the dice.", "Adjust the amount: <b>½</b> for resistance, <b>×2</b> for vulnerability, or <b>− / +</b>. Then <b>Apply Damage</b>, or <b>Miss</b> if it missed. Everyone sees the strike on their map."],
        art: `<div class="modal"><div class="t">Ogre → Eòghan · Swing Sword</div><div class="hpbar"><i></i></div><div class="m-row" style="justify-content:flex-start">Dice <span class="num" style="width:auto;padding:4px 8px">1d8+4</span><span class="chip">Roll</span><span class="chip">Crit</span></div><div class="m-row" style="justify-content:flex-start">Damage <span class="chip">−</span><span class="num">9</span><span class="chip">+</span><span class="chip">½</span><span class="chip">×2</span></div><div class="m-row" style="justify-content:flex-end"><span class="chip ghost">Miss</span><span class="chip ghost">Cancel</span><span class="chip pri hl">Apply Damage</span></div></div>`,
      },
      {
        t: "Apply a player's damage",
        p: ["When a player rolls damage at a target, it shows in your <b>History</b> with a <b>Deal Damage</b> button. It opens the same pop-up with their total (and crit) filled in: adjust, then Apply or Miss.", "Spell effects (✦ Hex…) get <b>Apply Effect</b> instead. To-hit rolls never get a button: whether it hit is your call."],
        art: `<div class="log"><div><b>Eòghan</b> Dagger DMG → ◎ Giant Rat · <b>9</b><span class="chip pri hl" style="margin-left:auto;padding:3px 9px">Deal Damage</span></div><div><b>Eòghan</b> ✦ Hex → ◎ Giant Rat<span class="chip" style="margin-left:auto;padding:3px 9px">Apply Effect</span></div></div>`,
      },
      {
        t: "Label events as they happen, and move on",
        p: ["Rolling something that isn't an attack, like an NPC's grapple or a check? Type what it's for in the Dice Roller's <b>For</b> box as you roll. Anything else in History can be labelled with <b>✎</b>, like “Ambush at the sluice”. Do it as it happens, while everyone remembers; the Chronicle's ✎ is there for anything missed.", "Use <b>▶ Next Turn</b> in Initiative to pass the turn (players can end their own if you allow it in Settings)."],
        art: `<div class="m-col"><div class="log"><div><b>Ogre</b> −9 Eòghan · 31 → 22 <span class="tag">· Ambush at the sluice</span><span class="pen hl">✎</span></div></div><span class="chip pri">▶ Next Turn</span></div>`,
      },
    ],
  };

  const state = { who: "player", i: 0, open: { wide: true, narrow: true } };

  function guide(frame) {
    const steps = STEPS[state.who], s = steps[state.i], last = state.i === steps.length - 1;
    return `<div class="shade"><div class="guide" role="dialog" aria-labelledby="g-h-${frame}">
      <div class="g-head"><span class="g-kicker">Combat quick start · ${state.who === "dm" ? "DM" : "Players"} · Step ${state.i + 1} of ${steps.length}</span><button class="g-x" data-close="${frame}" aria-label="Close">✕</button></div>
      <div class="g-art" aria-hidden="true">${s.art}</div>
      <div class="g-body"><h3 id="g-h-${frame}">${s.t}</h3>${s.p.map((x) => `<p>${x}</p>`).join("")}${s.tip ? `<p class="tip">${s.tip}</p>` : ""}</div>
      <div class="g-foot"><div class="dots">${steps.map((_, j) => `<button class="${j === state.i ? "on" : ""}" data-go="${j}" aria-label="Step ${j + 1}"></button>`).join("")}</div>
        <button class="btn" data-back ${state.i === 0 ? "disabled" : ""}>Back</button>
        <button class="btn primary" data-next>${last ? "Done" : "Next"}</button></div>
    </div></div>`;
  }
  function behind(frame) {
    const dm = state.who === "dm";
    return `<div class="behind"><div class="bar">${dm ? "Campaign · Shop · Maps · Chronicle" : "Eòghan MacGille Fàth"}</div>
      ${!dm && !state.open[frame] ? `<div class="offer">New to combat here? <button data-reopen-one="${frame}">Quick start ›</button></div>` : ""}
      <div class="blk"></div><div class="blk"></div><div class="blk" style="height:160px"></div></div>`;
  }
  function render() {
    for (const f of ["wide", "narrow"]) document.getElementById(f).innerHTML = behind(f) + (state.open[f] ? guide(f) : "");
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.pal) { document.body.dataset.pal = b.dataset.pal; document.querySelectorAll("[data-pal]").forEach((x) => x.classList.toggle("on", x === b)); return; }
    if (b.dataset.who) { state.who = b.dataset.who; state.i = 0; state.open = { wide: true, narrow: true }; document.querySelectorAll("[data-who]").forEach((x) => x.classList.toggle("on", x === b)); return render(); }
    if (b.dataset.reopen !== undefined) { state.i = 0; state.open = { wide: true, narrow: true }; return render(); }
    if (b.dataset.reopenOne) { state.i = 0; state.open[b.dataset.reopenOne] = true; return render(); }
    if (b.dataset.close) { state.open[b.dataset.close] = false; return render(); }
    const n = STEPS[state.who].length;
    if (b.dataset.go) state.i = Number(b.dataset.go);
    if (b.dataset.back !== undefined && state.i > 0) state.i--;
    if (b.dataset.next !== undefined) { if (state.i === n - 1) { state.open = { wide: false, narrow: false }; } else state.i++; }
    render();
  });
  document.addEventListener("keydown", (e) => {
    const n = STEPS[state.who].length;
    if (e.key === "ArrowRight" && state.i < n - 1) state.i++;
    else if (e.key === "ArrowLeft" && state.i > 0) state.i--;
    else if (e.key === "Escape") state.open = { wide: false, narrow: false };
    else return;
    render();
  });
  render();
</script>
</body>
</html>
